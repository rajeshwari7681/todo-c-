<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #1a1a2e;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #4f46e5;
      letter-spacing: -0.5px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    /* Form Card */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .card h2 { font-size: 1rem; color: #6366f1; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .form-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .form-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 140px; }

    label { font-size: 0.78rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.4px; }

    input[type="text"], input[type="number"], textarea {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus, textarea:focus { border-color: #6366f1; }

    textarea { resize: vertical; min-height: 70px; }

    .form-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }

    button {
      padding: 0.55rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }
    button:hover { opacity: 0.88; }

    .btn-primary { background: #6366f1; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #555; }
    .btn-danger { background: #ef4444; color: #fff; padding: 0.4rem 0.7rem; font-size: 0.8rem; }
    .btn-success { background: #22c55e; color: #fff; padding: 0.4rem 0.7rem; font-size: 0.8rem; }
    .btn-edit { background: #f59e0b; color: #fff; padding: 0.4rem 0.7rem; font-size: 0.8rem; }

    /* Todo list */
    #todo-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .todo-item {
      background: #fff;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: box-shadow 0.2s;
    }

    .todo-item:hover { box-shadow: 0 4px 16px rgba(99,102,241,0.12); }

    .todo-item.completed { opacity: 0.55; }

    .todo-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #6366f1;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px; cursor: pointer;
      transition: background 0.2s;
    }

    .todo-check.done { background: #6366f1; border-color: #6366f1; }
    .todo-check.done::after { content: '✓'; color: #fff; font-size: 0.75rem; font-weight: 700; }

    .todo-body { flex: 1; }

    .todo-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .todo-item.completed .todo-title { text-decoration: line-through; color: #9ca3af; }

    .todo-desc { font-size: 0.85rem; color: #6b7280; margin-top: 0.2rem; }

    .todo-meta {
      font-size: 0.75rem;
      color: #a3a3a3;
      margin-top: 0.4rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .price-badge {
      background: #ecfdf5;
      color: #16a34a;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .store-badge {
      background: #fef3c7;
      color: #d97706;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .status-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-pending { background: #fff7ed; color: #ea580c; }
    .status-done { background: #f0fdf4; color: #16a34a; }

    .todo-actions { display: flex; gap: 0.4rem; flex-shrink: 0; align-items: flex-start; }

    .empty-state { text-align: center; color: #9ca3af; padding: 3rem 0; font-size: 0.95rem; }

    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #1e293b; color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo App</h1>

    <!-- Add / Edit form -->
    <div class="card">
      <h2 id="form-title">Add New Todo</h2>
      <div class="form-row">
        <div class="form-group" style="flex:2;min-width:200px">
          <label for="title">Title *</label>
          <input type="text" id="title" placeholder="What needs to be done?" />
        </div>
        <div class="form-group" style="flex:1;min-width:120px">
          <label for="price">Price ($)</label>
          <input type="number" id="price" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="form-group" style="flex:1;min-width:120px">
          <label for="storeName">Store Name</label>
          <input type="text" id="storeName" placeholder="e.g., Walmart" />
        </div>
      </div>
      <div class="form-group" style="margin-top:0.75rem">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Optional details..."></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="submitForm()">Save Todo</button>
        <button class="btn-secondary" id="cancel-btn" style="display:none" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>

    <!-- Todo list -->
    <div id="todo-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '/api/todo';
    let editingId = null;

    async function fetchTodos() {
      const res = await fetch(API);
      const todos = await res.json();
      renderTodos(todos);
    }

    function renderTodos(todos) {
      const list = document.getElementById('todo-list');
      if (!todos.length) {
        list.innerHTML = '<div class="empty-state">No todos yet. Add one above!</div>';
        return;
      }
      list.innerHTML = todos.map(t => `
        <div class="todo-item ${t.isCompleted ? 'completed' : ''}">
          <div class="todo-check ${t.isCompleted ? 'done' : ''}" onclick="markComplete(${t.id}, ${t.isCompleted})"></div>
          <div class="todo-body">
            <div class="todo-title">${escHtml(t.title)}</div>
            ${t.description ? `<div class="todo-desc">${escHtml(t.description)}</div>` : ''}
            <div class="todo-meta">
              <span class="price-badge">$${Number(t.price).toFixed(2)}</span>
              ${t.storeName ? `<span class="store-badge">${escHtml(t.storeName)}</span>` : ''}
              <span class="status-badge ${t.isCompleted ? 'status-done' : 'status-pending'}">
                ${t.isCompleted ? 'Completed' : 'Pending'}
              </span>
              <span>${formatDate(t.createdAt)}</span>
            </div>
          </div>
          <div class="todo-actions">
            <button class="btn-edit" onclick="startEdit(${t.id})">Edit</button>
            <button class="btn-danger" onclick="deleteTodo(${t.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function submitForm() {
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const price = parseFloat(document.getElementById('price').value) || 0;
      const storeName = document.getElementById('storeName').value.trim();

      if (!title) { showToast('Title is required'); return; }

      const body = { title, description, price, storeName };

      if (editingId) {
        const current = await (await fetch(`${API}/${editingId}`)).json();
        await fetch(`${API}/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...body, isCompleted: current.isCompleted })
        });
        showToast('Todo updated');
        cancelEdit();
      } else {
        await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        showToast('Todo added');
        clearForm();
      }
      fetchTodos();
    }

    async function startEdit(id) {
      const res = await fetch(`${API}/${id}`);
      const t = await res.json();
      editingId = id;
      document.getElementById('title').value = t.title;
      document.getElementById('description').value = t.description || '';
      document.getElementById('price').value = t.price;
      document.getElementById('storeName').value = t.storeName || '';
      document.getElementById('form-title').textContent = 'Edit Todo';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      clearForm();
      document.getElementById('form-title').textContent = 'Add New Todo';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    async function markComplete(id, alreadyDone) {
      if (alreadyDone) return;
      await fetch(`${API}/${id}/complete`, { method: 'PATCH' });
      showToast('Marked as complete');
      fetchTodos();
    }

    async function deleteTodo(id) {
      if (!confirm('Delete this todo?')) return;
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      showToast('Todo deleted');
      fetchTodos();
    }

    function clearForm() {
      document.getElementById('title').value = '';
      document.getElementById('description').value = '';
      document.getElementById('price').value = '';
      document.getElementById('storeName').value = '';
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    fetchTodos();
  </script>
</body>
</html>
